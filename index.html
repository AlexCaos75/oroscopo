<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00060d" />
  <title>Ruota Lunare – Sentenza</title>
  <link rel="stylesheet" href="style.css?v=20251228-win" />
</head>

<body>

  <!-- INTRO -->
  <div id="cosmicCurtain" aria-hidden="true">
    <div class="curtain-text">IL DESTINO SI RISVEGLIA</div>
  </div>

  <!-- LOGIN -->
  <div id="loginModal" class="login-modal hidden" aria-hidden="false">
    <div class="login-panel" role="dialog" aria-modal="true">
      <h2>Benvenuto</h2>
      <p>Inserisci il tuo nome per entrare</p>

      <input id="loginName" type="text" placeholder="Nickname" maxlength="20" autocomplete="off" aria-label="Nickname" />
      <button id="loginBtn" type="button">ENTRA</button>
    </div>
  </div>

  <!-- APP -->
  <main class="app hidden" role="main">

    <section class="cards-zone" aria-label="Carte zodiacali sinistra">
      <div id="cardsLeft" class="cards"></div>
    </section>

    <section class="wheel-zone" aria-label="Ruota del destino">
      <div class="wheel-glow" aria-hidden="true"></div>

      <div id="wheel" class="wheel idle" aria-live="off" aria-label="Ruota">
        <div class="wheel-core" aria-hidden="true">🌙</div>
      </div>

      <div class="controls hidden" id="controls" aria-label="Comandi">
        <button id="spin" type="button" aria-label="Avvia la ruota">SCEGLI</button>
        <button id="adminBtn" type="button" aria-label="Area amministratore">ADMIN</button>
      </div>
    </section>

    <section class="cards-zone" aria-label="Carte zodiacali destra">
      <div id="cardsRight" class="cards"></div>
    </section>

  </main>

  <!-- MODALE OROSCOPO -->
  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true"></div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="fullscreen-card" role="dialog" aria-modal="true">
      <button id="closeModal" class="close" aria-label="Chiudi scheda">&times;</button>
      <div id="fullscreenImage" class="fullscreen-image" aria-hidden="true"></div>

      <div class="oracle-text">
        <h2 id="modalTitle"></h2>
        <p id="modalLore"></p>
        <p id="modalHint"></p>

        <h3>Oroscopo 2026</h3>
        <p id="oroscopo2026"></p>
      </div>
    </div>
  </div>

  <!-- MODALE ADMIN -->
  <div id="adminModal" class="modal hidden" aria-hidden="true">
    <div class="admin-panel" role="dialog" aria-modal="true">
      <h2>Editor Oroscopo 2026</h2>

      <label class="sr-only" for="adminSelect">Segno</label>
      <select id="adminSelect"></select>

      <label class="sr-only" for="adminText">Testo oroscopo</label>
      <textarea id="adminText" placeholder="Scrivi qui l'oroscopo..." rows="6"></textarea>

      <!-- ✅ POST NEUTRO (13° evento) - NON pescato dalla ruota -->
      <div style="margin-top:14px; display:grid; gap:10px;">

        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="presetAnnuncio" type="button"
            style="padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.22); color:#fff; font-weight:700; cursor:pointer;">
            PRESET: ANNUNCIO
          </button>

          <button id="presetEvento" type="button"
            style="padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.22); color:#fff; font-weight:700; cursor:pointer;">
            PRESET: EVENTO
          </button>

          <button id="presetLink" type="button"
            style="padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.22); color:#fff; font-weight:700; cursor:pointer;">
            PRESET: LINK IMPORTANTE
          </button>
        </div>

        <input id="postTitle" type="text"
          placeholder="Titolo post neutro (es: Luna Vallyy - Messaggio del Pianeta Segreto)"
          maxlength="80"
          style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:#fff;" />

        <textarea id="postBody" rows="5"
          placeholder="Testo post neutro - qui scrivi tu (Discord safe)"
          style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:#fff; resize:vertical;"></textarea>

        <input id="postLink" type="text"
          placeholder="Link del post (opzionale) es: https://alexcaos75.github.io/oroscopo/"
          style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:#fff;" />

        <input id="postImage" type="text"
          placeholder="Immagine (opzionale) es: immagini/spot1.jpg oppure https://..."
          style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:#fff;" />

        <input id="postVideo" type="text"
          placeholder="YouTube ID (opzionale) es: dQw4w9WgXcQ"
          style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.25); color:#fff;" />

        <div style="font-size:12.5px; opacity:.85; line-height:1.35;">
          Nota: il POST NEUTRO non usa segni zodiacali. Serve solo per creare un post elegante in Bacheca (con immagine o YouTube opzionali).
        </div>
      </div>

      <div class="admin-actions">
        <button id="saveAdmin" type="button">SALVA</button>
        <button id="postBacheca" type="button">POST OROSCOPO</button>

        <!-- ✅ questo ora e' il POST NEUTRO (13° evento) -->
        <button id="postSpot" type="button">POST NEUTRO</button>

        <button id="copyDiscord" type="button">COPIA DISCORD</button>
        <button id="closeAdmin" type="button">CHIUDI</button>
      </div>

      <div class="admin-links" style="margin-top:10px; font-size:13px; opacity:.9;">
        Bacheca Pianeta Segreto:
        <a href="./bacheca.html" target="_blank" rel="noopener">apri</a>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatLuna" class="chat-luna collapsed" aria-live="polite" aria-label="Chat pubblica della Luna">
    <div class="chat-header" id="chatHeader">
      <span>LUNA - Chat Pubblica</span>
      <div class="chat-actions">
        <button id="chatReset" type="button" title="Reset chat" aria-label="Reset chat">RESET</button>
        <span id="chatToggle" aria-hidden="true">+</span>
      </div>
    </div>

    <div id="chatMessages" class="chat-messages" role="log" aria-relevant="additions"></div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Scrivi alla Luna..." maxlength="160" autocomplete="off" aria-label="Messaggio chat" />
      <button id="chatSend" type="button" aria-label="Invia messaggio">INVIA</button>
    </div>
  </div>

  <script type="module" src="script.js?v=20251228-win"></script>
  <script type="module" src="chat-luna.js?v=20251228-win"></script>

  <!-- ✅ Preset JS (solo UI) -->
  <script>
    // questi preset NON toccano il tuo script.js: riempiono solo i campi neutri.
    function setPreset(title, body, link){
      const t = document.getElementById("postTitle");
      const b = document.getElementById("postBody");
      const l = document.getElementById("postLink");
      if (t) t.value = title || "";
      if (b) b.value = body || "";
      if (l) l.value = link || "";
    }

    document.addEventListener("click", (e) => {
      const id = e.target && e.target.id;
      if (!id) return;

      if (id === "presetAnnuncio"){
        setPreset(
          "Luna Vallyy - Annuncio dal Pianeta Segreto",
          "Il nostro oracolo ci accompagna.\n\nOggi il cielo apre una nuova porta.\nResta vicino alla Luna e segui il segnale.\n\nA presto.",
          "https://alexcaos75.github.io/oroscopo/"
        );
      }

      if (id === "presetEvento"){
        setPreset(
          "Luna Vallyy - Evento del Pianeta Segreto",
          "Questa sera il destino si muove.\n\nPreparati: una scelta, una rivelazione, un segno.\n\nEntra e ascolta la Luna.",
          "https://alexcaos75.github.io/oroscopo/"
        );
      }

      if (id === "presetLink"){
        setPreset(
          "Luna Vallyy - Link Importante",
          "Messaggio rapido dal Pianeta Segreto.\n\nApri il varco qui sotto.\n\nIl destino parla a chi sa ascoltare.",
          "https://alexcaos75.github.io/oroscopo/"
        );
      }
    });
  </script>
</body>
</html>
