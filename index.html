<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00060d" />
  <title>Ruota Lunare – Sentenza</title>
  <link rel="stylesheet" href="style.css?v=20251228-capolavoro" />
</head>

<body>

  <!-- ✅ MUSIC SANDBOX (INVINCIBILE)
       Qui il tuo JS può creare/gestire l'iframe audio senza dipendere dall'HTML incollato. -->
  <div id="psMusicSandbox"
       style="position:fixed; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; display:block; visibility:hidden;">
  </div>

  <!-- INTRO -->
  <div id="cosmicCurtain" aria-hidden="true">
    <div class="curtain-text">IL DESTINO SI RISVEGLIA</div>
  </div>

  <!-- LOGIN -->
  <div id="loginModal" class="login-modal hidden" aria-hidden="false">
    <div class="login-panel" role="dialog" aria-modal="true">
      <h2>Benvenuto</h2>
      <p>Inserisci il tuo nome per entrare</p>

      <input id="loginName" type="text" placeholder="Nickname" maxlength="20" autocomplete="off" aria-label="Nickname" />
      <button id="loginBtn" type="button">ENTRA</button>
    </div>
  </div>

  <!-- APP -->
  <main class="app hidden" role="main">

    <section class="cards-zone" aria-label="Carte zodiacali sinistra">
      <div id="cardsLeft" class="cards"></div>
    </section>

    <section class="wheel-zone" aria-label="Ruota del destino">
      <div class="wheel-glow" aria-hidden="true"></div>

      <div id="wheel" class="wheel idle" aria-live="off" aria-label="Ruota">
        <div class="wheel-core" aria-hidden="true">🌙</div>
      </div>

      <div class="controls hidden" id="controls" aria-label="Comandi">
        <button id="spin" type="button" aria-label="Avvia la ruota">SCEGLI</button>
        <button id="adminBtn" type="button" aria-label="Area amministratore">ADMIN</button>
      </div>

      <div id="roundInfo" style="margin-top:10px; font-weight:800; opacity:.9; letter-spacing:.4px;"></div>
    </section>

    <section class="cards-zone" aria-label="Carte zodiacali destra">
      <div id="cardsRight" class="cards"></div>
    </section>

  </main>

  <!-- MODALE OROSCOPO -->
  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true"></div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="fullscreen-card" role="dialog" aria-modal="true">
      <button id="closeModal" class="close" aria-label="Chiudi scheda">&times;</button>

      <!-- ✅ il cover lo gestiamo da CSS/JS, qui va bene -->
      <div id="fullscreenImage" class="fullscreen-image" aria-hidden="true"></div>

      <div class="oracle-text">
        <h2 id="modalTitle"></h2>
        <p id="modalLore"></p>
        <p id="modalHint"></p>

        <h3>Oroscopo 2026</h3>
        <p id="oroscopo2026"></p>
      </div>
    </div>
  </div>

  <!-- MODALE ADMIN (RIORDINATO + POST NEUTRO + COPIA POST) -->
  <div id="adminModal" class="modal hidden" aria-hidden="true">
    <div class="admin-panel" role="dialog" aria-modal="true">

      <h2>Editor Oroscopo 2026</h2>

      <!-- OR0SCOPO EDITOR -->
      <label class="sr-only" for="adminSelect">Segno</label>
      <select id="adminSelect"></select>

      <label class="sr-only" for="adminText">Testo oroscopo</label>
      <textarea id="adminText" placeholder="Scrivi qui l'oroscopo..." rows="6"></textarea>

      <hr style="border:0;height:1px;background:rgba(255,255,255,.12);margin:14px 0;" />

      <!-- POST NEUTRO (INDIPENDENTE) -->
      <div style="display:grid; gap:10px;">
        <div style="font-weight:900; letter-spacing:.4px; opacity:.95;">POST NEUTRO (indipendente)</div>

        <input id="pnTitle" type="text"
          placeholder="POST NEUTRO — Titolo (opzionale)"
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;" />

        <textarea id="pnBody" rows="4"
          placeholder="POST NEUTRO — Testo (opzionale)"
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;"></textarea>

        <input id="pnLink" type="text"
          placeholder="POST NEUTRO — Link (opzionale) es: https://alexcaos75.github.io/oroscopo/"
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;" />

        <input id="pnImage" type="text"
          placeholder="POST NEUTRO — Immagine/GIF (opzionale) es: immagini/spot1.gif oppure https://..."
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;" />

        <!-- ✅ ora puoi incollare: ID / link / iframe embed -->
        <input id="pnVideo" type="text"
          placeholder="POST NEUTRO — Video YouTube (opzionale) ID / link / iframe embed"
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;" />

        <input id="pnMusic" type="text"
          placeholder="POST NEUTRO — Musica YouTube (opzionale) ID / link / iframe embed (ASCOLTA/STOP + loop)"
          style="width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.24); color:#fff;" />

        <!-- scelta video -->
        <div style="display:flex; gap:16px; align-items:center; font-size:13px; opacity:.95;">
          <label style="display:flex; gap:8px; align-items:center; cursor:pointer; font-weight:800;">
            <input type="radio" name="pnVideoMode" value="visible" checked />
            Video visibile
          </label>
          <label style="display:flex; gap:8px; align-items:center; cursor:pointer; font-weight:800;">
            <input type="radio" name="pnVideoMode" value="hidden" />
            Solo musica (invisibile)
          </label>
        </div>
      </div>

      <div class="admin-actions" style="margin-top:14px;">
        <button id="saveAdmin" type="button">SALVA</button>
        <button id="postBacheca" type="button">POST OROSCOPO</button>
        <button id="postNeutral" type="button">POST NEUTRO</button>
        <button id="copyDiscord" type="button">COPIA DISCORD</button>
        <button id="copyPost" type="button">COPIA POST</button>
        <button id="closeAdmin" type="button">CHIUDI</button>
      </div>

      <div class="admin-links" style="margin-top:10px; font-size:13px; opacity:.95;">
        Bacheca Pianeta Segreto:
        <a href="./bacheca.html" target="_blank" rel="noopener">apri</a>
      </div>

    </div>
  </div>

  <!-- CHAT -->
  <div id="chatLuna" class="chat-luna collapsed" aria-live="polite" aria-label="Chat pubblica della Luna">
    <div class="chat-header" id="chatHeader">
      <span>LUNA - Chat Pubblica</span>
      <div class="chat-actions">
        <button id="chatReset" type="button" title="Reset chat" aria-label="Reset chat">RESET</button>
        <span id="chatToggle" aria-hidden="true">+</span>
      </div>
    </div>

    <div id="chatMessages" class="chat-messages" role="log" aria-relevant="additions"></div>

    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Scrivi alla Luna..." maxlength="160" autocomplete="off" aria-label="Messaggio chat" />
      <button id="chatSend" type="button" aria-label="Invia messaggio">INVIA</button>
    </div>
  </div>

  <script type="module" src="script.js?v=20251228-capolavoro"></script>
  <script type="module" src="chat-luna.js?v=20251228-capolavoro"></script>
</body>
</html>
