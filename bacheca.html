<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00060d" />
  <title>Bacheca Pianeta Segreto</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* mini stile extra, non rompe il tuo style.css */
    .bacheca-wrap{max-width:900px;margin:0 auto;padding:22px 14px;}
    .bacheca-card{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;backdrop-filter: blur(6px);}
    .bacheca-title{font-size:20px;margin:0 0 8px 0;}
    .bacheca-sub{opacity:.85;margin:0 0 14px 0;line-height:1.35;}
    .bacheca-meta{opacity:.85;font-size:13px;margin:10px 0 10px;}
    .bacheca-text{white-space:pre-wrap;line-height:1.35;background:rgba(255,255,255,.06);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.10);}
    .bacheca-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .bacheca-actions button, .bacheca-actions a{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);color:#fff;text-decoration:none;cursor:pointer;
    }
    .bacheca-actions button:hover,.bacheca-actions a:hover{background:rgba(255,255,255,.12)}
    .bacheca-empty{opacity:.85}
  </style>
</head>

<body>
  <div class="bacheca-wrap">
    <div class="bacheca-card">
      <h1 class="bacheca-title">Bacheca Pianeta Segreto</h1>
      <p class="bacheca-sub">
        Ultimo messaggio pubblicato da <b>Luna Vallyy</b> (testo pulito, pronto anche per Discord).
      </p>

      <div id="bachecaState" class="bacheca-empty">Caricamento...</div>

      <div id="bachecaBlock" style="display:none;">
        <div class="bacheca-meta" id="bachecaMeta"></div>

        <div class="bacheca-text" id="bachecaText"></div>

        <div class="bacheca-actions">
          <a id="bachecaOpenLink" href="#" target="_blank" rel="noopener">Apri link</a>
          <button id="bachecaCopy">Copia Discord</button>
          <a href="index.html">Torna alla Ruota</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="bacheca.js?v=20251228-capolavoro"></script>
</body>
</html>
